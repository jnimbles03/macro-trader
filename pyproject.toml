[project]
name = "macro-options-scout"
version = "0.3.0"
description = "Local macro/options research agent with dual-LLM synthesis + centralized market data layer."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Macro Options Scout" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "scipy>=1.12",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "ib-async>=1.0.3",
    "feedparser>=6.0",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "freezegun>=1.4",
]

[project.scripts]
macro-scout = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
